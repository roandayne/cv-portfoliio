    <!-- Arms the scroll-reveal system before the first paint, so nothing is
         hidden for a reader without JavaScript and nothing flashes in for a
         reader with it. The timeout is a failsafe: if the bundle never runs,
         the `js` class comes back off and the prerendered page stands as it
         is. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        setTimeout(function () {
          if (!root.hasAttribute('data-motion')) root.classList.remove('js');
        }, 4000);
      })();
    </script>
